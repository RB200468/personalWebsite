server.port=8080

# Where the SQLite file lives. Override with the DATABASE_PATH environment variable.
# The default is a relative path, so the file is created in the directory the app is started from.
# *.db is git-ignored.
app.database.path=${DATABASE_PATH:website.db}
spring.datasource.url=jdbc:sqlite:${app.database.path}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Flyway runs the scripts in src/main/resources/db/migration on startup.
spring.flyway.enabled=true
